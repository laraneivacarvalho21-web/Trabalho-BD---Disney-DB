{% extends "base.html" %}

{% block title %}Lista de Géneros{% endblock %}

{% block content %}
<div class="card">
    <h1>Lista de Géneros</h1>
    <p>Total: {{ genres|length }} géneros</p>
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Nº de Conteúdos</th>
            </tr>
        </thead>
        <tbody>
            {% for genre in genres %}
            <tr>
                <td>{{ genre.genre_id }}</td>
                <td><a class="link" href="/genre/{{ genre.genre_id }}/">{{ genre.name }}</a></td>
                <td>{{ genre.content_count }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
